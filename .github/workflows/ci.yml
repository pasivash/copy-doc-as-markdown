name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(jq -r .version src/manifest.json)" = "$GITHUB_REF_NAME"
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: copy-doc-as-markdown
          path: dist/copy-doc-as-markdown.zip
      - name: Attach zip to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" dist/copy-doc-as-markdown.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
